services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pojokkampus-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=pojok_kampus
      - DB_USERNAME=pojokkampus
      - DB_PASSWORD=secret
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/public/build
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pojokkampus-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: pojokkampus-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pojok_kampus
      MYSQL_USER: pojokkampus
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pojokkampus-network

  # phpMyAdmin (optional - for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pojokkampus-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: pojokkampus
      PMA_PASSWORD: secret
    depends_on:
      - mysql
    networks:
      - pojokkampus-network

  # Mailhog (for email testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: pojokkampus-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pojokkampus-network

networks:
  pojokkampus-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
